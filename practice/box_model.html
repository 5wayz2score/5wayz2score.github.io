<!DOCTYPE html>
<html lang="en">
   <head>
     <title>Box Model Practice</title>
     <script> src="../validate.js"></script>
     <style>
       #redbox{
         background-color:red;
         height:100px;
         width:100px;
         border:2px black solid;
         background-clip:content-box;
         margin-left:300px;
       }
       #bluebox{
         background-color:blue;
         width:100px;
         height:100px;
         border:5px black solid;
         margin-left:400px;
         margin-top:2px;
         margin-bottom:40px;
       }
       #greenbox{
         background-color:green;
         width:100px;
         height:100px;
         border:5px solid black;
         margin-left:200px;
         margin-top:-50px
       }
       #yellowbox{
         background-color:yellow;
         width:100px
         height:100px
         border:5px solid black;
         margin-left:200px
         margin-top:50px
       }
         
     </style>
   </head>
   <body>
     <h1>Here are some boxes</h1>
     <div id="redbox">></div>
   </body>
